    - 韩国-自动
    - 美国-自动
    - 欧洲-自动
    - 香港-手动
    - 台湾-手动
    - 日本-手动
    - 新加坡-手动
    - 韩国-手动
    - 美国-手动
    - 欧洲-手动
    - 其他-手动
    - 国内直连


Anchor_LD: &Anchor_LD
