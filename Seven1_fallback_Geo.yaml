# 名称：Seven1_fallback_Rule-Set_Clashmi_iPhone_Optimized
# 版本：V2026.9.1
# 用途：Clash Mi / iPhone
# 特别规则：
# 1. schwab.com 强制国内直连
# 2. thinkorswim.com 强制国内直连
# 3. 国内网站直连
# 4. 国际服务按专用策略组分流
# 5. 国际普通网站走一键代理
# 6. DNS 使用加密 DNS
# 7. 保留 UDP/443 拦截，减少 QUIC 分流异常


# ███████████████████████████ 锚点区域 ███████████████████████████

