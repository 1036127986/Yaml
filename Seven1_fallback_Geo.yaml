    - 欧洲-手动
    - 其他-手动


Anchor_DR: &Anchor_DR
  type: select
  proxies:
    - DIRECT
  hidden: true


# ══ 策略锚点 ══

Anchor_HS: &Anchor_HS
  type: select
  empty-fallback: REJECT
  include-all: true


Anchor_FB: &Anchor_FB
  type: fallback
  empty-fallback: REJECT
  interval: 300
  lazy: false
  timeout: 3000
  max-failed-times: 2
  hidden: true
  url: https://www.gstatic.com/generate_204


Anchor_UT: &Anchor_UT
  type: url-test
  empty-fallback: REJECT
  interval: 300
  lazy: false
  timeout: 3000
  max-failed-times: 2
  hidden: true
  url: https://www.gstatic.com/generate_204
  tolerance: 50
  include-all: true


# ══ 规则锚点 ══

Anchor_DN: &Anchor_DN
  type: http
  interval: 86400
  behavior: domain
  format: mrs


Anchor_IP: &Anchor_IP
  type: http
  interval: 86400
  behavior: ipcidr
  format: mrs


Anchor_CL: &Anchor_CL
  type: http
  interval: 86400
  behavior: classical
  format: text


# ══ 区域锚点 ══

