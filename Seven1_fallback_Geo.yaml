# ███████████████████████████ 基础配置 ███████████████████████████

mode: rule

ipv6: true

mixed-port: 7893

allow-lan: true

bind-address: "*"

log-level: warning

unified-delay: true

tcp-concurrent: true

global-ua: clash.meta

profile:
  store-selected: true
  store-fake-ip: true


# ══ 管理面板 ══
#
# iPhone 使用时不需要把 API 暴露给整个局域网。
# 改为本机监听，降低风险。

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

external-controller: 127.0.0.1:9090

external-ui-name: zashboard

external-ui: ui

secret: ""


# ███████████████████████████ TUN 配置 ███████████████████████████

tun:
  enable: true

  stack: mixed

  dns-hijack:
    - udp://any:53
    - tcp://any:53

  auto-detect-interface: true

  auto-route: true

  auto-redirect: true

  strict-route: true

  endpoint-independent-nat: false


# ███████████████████████████ 嗅探 ███████████████████████████

sniffer:
  enable: true

  override-destination: true

  parse-pure-ip: true

  force-dns-mapping: true

  sniff:
    QUIC:
      ports:
        - 443

    TLS:
      ports:
        - 443
        - 8443

    HTTP:
      ports:
        - 80
        - 8080-8880

  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
    - "+.tiktok.com"

  skip-domain:
    - "dlg.io.mi.com"
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.miwifi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"


# ███████████████████████████ HOSTS ███████████████████████████

hosts:
  'services.googleapis.cn':
    - 'services.googleapis.com'


# ███████████████████████████ DNS 配置 ███████████████████████████

dns:

  enable: true

  ipv6: true

  use-hosts: true

  use-system-hosts: true

  cache-algorithm: arc

  listen: 0.0.0.0:7874

  enhanced-mode: fake-ip

  fake-ip-range: 198.18.0.1/16

  fake-ip-range6: 2001:2::1/48

  fake-ip-filter-mode: blacklist

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "rule-set:add_direct_domain"

  respect-rules: true

  # 用于解析 DNS 服务器自身的域名
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114

  # 默认使用国外加密 DNS
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"

  # 中国域名使用国内加密 DNS
  nameserver-policy:
    "rule-set:cn_domain":
      - "https://doh.pub/dns-query"
      - "https://dns.alidns.com/dns-query"

  # 代理节点自身的域名使用国内 DNS，
  # 防止代理节点域名解析出现循环依赖
  proxy-server-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"

  # 国内直连域名优先使用国内加密 DNS
  direct-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"

  direct-nameserver-follow-policy: true


